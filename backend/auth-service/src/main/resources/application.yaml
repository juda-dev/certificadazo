server:
  port: 8081

spring:
  application:
    name: auth-service

  threads:
    virtual:
      enabled: true

  config:
    import: optional:file:.env[.properties]

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/certificadazo
          jwk-set-uri: http://localhost:8080/realms/certificadazo/protocol/openid-connect/certs

  cloud:
    function:
      definition: handleCommands

    stream:
      bindings:
        handleCommands-in-0:
          destination: users-events
          group: auth-service
        handleCommands-out-0:
          destination: keycloak-replies

      kafka:
        binder:
          brokers: localhost:9092
          enable-observation: true

keycloak:
  server-url: http://localhost:8080
  realm: certificadazo
  client-id: certificadazo-client
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

management:
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        enabled: true