server:
  port: ${PORT:0}

spring:
  application:
    name: users-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3300/users-db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:judadev}
  jpa:
    hibernate:
      ddl-auto: update

  cloud:
    function:
      definition: handleReplies

    stream:
      bindings:
        commands-out-0:
          destination: users-events
          content-type: application/json
        handleReplies-in-0:
          destination: keycloak-replies
          content-type: application/json
          group: users-service

      kafka:
        binder:
          brokers: ${KAFKA_URI:localhost:9092}
          enable-observation: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

management:
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        enabled: true
